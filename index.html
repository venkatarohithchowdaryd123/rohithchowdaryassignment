<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);color:#fff}
header{padding:50px 20px 30px;text-align:center}
header h1{font-size:clamp(30px,5vw,52px);margin-bottom:10px}
header p{color:#dbeafe;font-size:17px}
.container{width:min(1200px,94%);margin:auto;padding-bottom:50px}
.stats{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:20px 0 30px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:12px 20px;border-radius:14px;backdrop-filter:blur(10px)}

.section{margin:30px 0}
.section h2{font-size:28px;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid rgba(255,255,255,.2)}
.group{margin:18px 0}
.group h3{font-size:19px;color:#bfdbfe;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);border-radius:13px;padding:16px;transition:.2s}
.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.18);border-color:#93c5fd}
.number{font-size:12px;color:#93c5fd;margin-bottom:7px}
.name{font-weight:700;font-size:15px;line-height:1.35}
.path{font-size:11px;color:#cbd5e1;margin-top:8px;word-break:break-all}
.empty{text-align:center;padding:40px;color:#cbd5e1;display:none}
footer{text-align:center;color:#cbd5e1;padding:25px}
</style>

document.getElementById("total").textContent = programs.length;
document.getElementById("htmlCount").textContent = programs.filter(p => p.category === "HTML").length;
document.getElementById("cssCount").textContent = programs.filter(p => p.category === "CSS").length;
document.getElementById("jsCount").textContent = programs.filter(p => p.category === "JavaScript").length;

const content = document.getElementById("content");
const empty = document.getElementById("empty");
const search = document.getElementById("search");
const category = document.getElementById("category");

function render() {
    const q = search.value.toLowerCase().trim();
    const cat = category.value;

    const filtered = programs.filter(p =>
        (cat === "all" || p.category === cat) &&
        (!q || (p.title + " " + p.path + " " + p.group).toLowerCase().includes(q))
    );

    const categories = ["HTML", "CSS", "JavaScript"];
    content.innerHTML = "";

    categories.forEach(catName => {
        const categoryItems = filtered.filter(p => p.category === catName);
        if (!categoryItems.length) return;

        const section = document.createElement("section");
        section.className = "section";

        const h2 = document.createElement("h2");
        h2.textContent = catName === "HTML" ? "🌐 HTML Programs" :
                         catName === "CSS" ? "🎨 CSS Programs" : "⚡ JavaScript Programs";
        section.appendChild(h2);

        const groups = [...new Set(categoryItems.map(p => p.group))];

        groups.forEach(groupName => {
            const items = categoryItems.filter(p => p.group === groupName);

            const group = document.createElement("div");
            group.className = "group";

            if (groups.length > 1) {
                const h3 = document.createElement("h3");
                h3.textContent = groupName;
                group.appendChild(h3);
            }

            const grid = document.createElement("div");
            grid.className = "grid";

            items.forEach((p, i) => {
                const a = document.createElement("a");
                a.className = "card";
                a.href = encodeURI(p.path);
                a.target = "_self";

                const number = document.createElement("div");
                number.className = "number";
                number.textContent = "Program " + (i + 1);

                const name = document.createElement("div");
                name.className = "name";
                name.textContent = p.title;

                const path = document.createElement("div");
                path.className = "path";
                path.textContent = p.path;

                a.append(number, name, path);
                grid.appendChild(a);
            });

            group.appendChild(grid);
            section.appendChild(group);
        });

        content.appendChild(section);
    });

    empty.style.display = filtered.length ? "none" : "block";
}

search.addEventListener("input", render);
category.addEventListener("change", render);
render();
</script>
